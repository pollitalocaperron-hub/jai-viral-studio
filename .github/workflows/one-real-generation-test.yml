name: JAI one real generation test
on:
  push:
    branches:
      - test/one-real-generation-20261123
    paths:
      - .github/workflows/one-real-generation-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-real-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run exactly one controlled production pipeline
        env:
          API_BASE: https://jai-viral-studio.vercel.app
        run: |
          mkdir -p evidence
          cat > /tmp/run.mjs <<'EOF'
          import fs from 'node:fs/promises';
          const base = process.env.API_BASE;
          const topic = 'Cómo se forman las olas del mar y qué las pone en movimiento';
          async function post(path, body) {
            const response = await fetch(base + path, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Origin': 'https://pollitalocaperron-hub.github.io' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(70000)
            });
            const raw = await response.text();
            let data;
            try { data = JSON.parse(raw); } catch { data = { raw: raw.slice(0, 1200) }; }
            await fs.writeFile('evidence/' + path.split('/').pop() + '.json', JSON.stringify({ httpStatus: response.status, data }, null, 2));
            if (!response.ok) throw new Error(path + ' failed HTTP ' + response.status + ': ' + JSON.stringify(data).slice(0, 900));
            return data;
          }
          const plan = await post('/api/generate', {
            topic,
            notes: 'Video educativo breve, riguroso y visualmente claro. No inventes personajes.',
            duration: '30–45 segundos',
            platform: 'Reels',
            format_mode: 'educativo',
            cta_goal: 'follow'
          });
          if (plan.clarification_required) {
            console.log('GENERATION_REQUIRES_CLARIFICATION:', plan.clarification_question);
            process.exit(0);
          }
          if (!Array.isArray(plan.story) || plan.story.length < 4 || !plan.script) throw new Error('La API respondió sin guion/storyboard completos.');
          const shots = await post('/api/direct-scenes', {
            topic, script: plan.script, story: plan.story,
            retention_map: plan.retention_map || [],
            style_profile_id: 'jai-reference-motion-01'
          });
          if (!Array.isArray(shots.shots) || shots.shots.length < 8) throw new Error('El director no devolvió un plan de tomas válido.');
          const narration = await post('/api/narrate', { text: plan.script, voice: 'Kore' });
          if (!narration.audioBase64) throw new Error('La narración no devolvió audio.');
          const audio = Buffer.from(narration.audioBase64, 'base64');
          await fs.writeFile('evidence/narration.pcm', audio);
          const summary = {
            topic, script: plan.script, storyScenes: plan.story.length,
            directedShots: shots.shots.length,
            characterBibleEntries: Array.isArray(shots.character_bible) ? shots.character_bible.length : null,
            reusableRigs: Array.isArray(shots.reusable_rigs) ? shots.reusable_rigs.length : null,
            narrationProvider: narration.provider || null,
            narrationSampleRate: narration.sampleRate || null,
            narrationBytes: audio.length
          };
          await fs.writeFile('evidence/summary.json', JSON.stringify(summary, null, 2));
          console.log('PIPELINE_SUCCESS', JSON.stringify(summary));
          EOF
          node /tmp/run.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jai-one-real-generation-evidence
          path: evidence/
          if-no-files-found: warn
