name: Validate J.A.I. source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check API modules
        run: |
          node --check --input-type=module < api/generate.js
          node --check --input-type=module < api/narrate.js
          node --check --input-type=module < api/inspect-visual.js
      - name: Check inline browser scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1])
            .filter(source => source.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((source, index) => new vm.Script(source, { filename: "index.html:inline-script-" + (index + 1) }));
          console.log("Validated " + scripts.length + " inline script(s).");
          NODE
