name: Validate J.A.I. source

concurrency:
  group: jai-viral-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'jai/visual-assets-preview-20261123']
  pull_request:
    branches: [main]

jobs:

  production-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify published Pages and Vercel production API without provider calls
        run: node tests/production-api-smoke.mjs

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check API modules
        run: |
          node --check --input-type=module < api/generate.js
          node --check --input-type=module < api/narrate.js
          node --check --input-type=module < api/inspect-visual.js
          node --check --input-type=module < api/direct-scenes.js
          node --check --input-type=module < api/visual-style-profiles.js
          node --check --input-type=module < api/search-visual-assets.js
          node --check --input-type=module < jai-openverse-asset-bridge.js
          node --check --input-type=module < jai-visual-asset-store.js
          node --check --input-type=module < jai-media-renderer.js
          node --check tests/media-renderer-contract.mjs
          node --check tests/visual-assets-contract.mjs
          node --check --input-type=module < worker.js
          node --check tests/worker-adapter.mjs
          node --check netlify/functions/inspect-visual.mjs
          node --check tests/netlify-inspect-adapter.mjs
      - name: Check inline browser scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1])
            .filter(source => source.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((source, index) => new vm.Script(source, { filename: "index.html:inline-script-" + (index + 1) }));
          console.log("Validated " + scripts.length + " inline script(s).");
          NODE

  browser-persistence:
    runs-on: ubuntu-24.04
    env:
      JAI_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Test API contracts
        run: npm run test:api
      - name: Test scene contracts
        run: npm run test:scene-contract
      - name: Test locked visual style and asset library
        run: npm run test:visual-assets
      - name: Test local media import and renderer contracts
        run: npm run test:media-renderer
      - name: Test Cloudflare Worker adapter and shared limiter
        run: npm run test:worker
      - name: Test private Netlify inspector adapter with mocked Gemini
        run: npm run test:netlify
      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Test IndexedDB persistence in Chromium
        run: npm run test:browser
      - name: Install Google Chrome Stable with native media codecs
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor --yes -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom 'data:text/html,<video id="v"></video><script>document.title=document.querySelector("video").canPlayType("video/mp4; codecs=&quot;avc1.42E01E, mp4a.40.2&quot;")||"NO_H264_AAC"</script>' | grep -q '<title>probably</title>\|<title>maybe</title>'
      - name: Test complete production flow in Chromium
        run: npm run test:e2e
      - name: Test real local media import and canvas rendering in Chromium
        run: npm run test:media-browser
      - name: Install portable FFmpeg and FFprobe tools
        run: |
          npm install --no-save --no-package-lock ffmpeg-static ffprobe-static
          FFMPEG_BIN="$(node -p "require('ffmpeg-static')")"
          FFPROBE_BIN="$(node -p "require('ffprobe-static').path")"
          test -x "$FFMPEG_BIN"
          test -x "$FFPROBE_BIN"
          export PATH="$(dirname "$FFMPEG_BIN"):$(dirname "$FFPROBE_BIN"):$PATH"
          echo "$(dirname "$FFMPEG_BIN")" >> "$GITHUB_PATH"
          echo "$(dirname "$FFPROBE_BIN")" >> "$GITHUB_PATH"
          ffmpeg -version
          ffprobe -version
      - name: Independently inspect the real production-button export with FFprobe
        run: |
          EXPORT_FILE="$(find artifacts -maxdepth 1 -type f -name 'jai-production-export.*' ! -name '*.json' | head -n 1)"
          test -n "$EXPORT_FILE"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -show_entries format=duration,size -of json "$EXPORT_FILE" > artifacts/jai-production-export.ffprobe.json
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const report=JSON.parse(fs.readFileSync("artifacts/jai-production-export.ffprobe.json","utf8"));
            const video=report.streams?.find(stream=>stream.codec_type==="video");
            const audio=report.streams?.find(stream=>stream.codec_type==="audio");
            assert.ok(video,"The production export must contain a video stream");
            assert.ok(audio,"The production export must contain the narration audio stream");
            assert.equal(video.width,720);
            assert.equal(video.height,1280);
            assert.ok(Number(report.format?.duration)>0);
            assert.ok(Number(report.format?.size)>20000);
            console.log("PASS: real production export inspected by FFprobe", {video,audio,format:report.format});
          '
      - name: Render real J.A.I. image, sequence and clip timeline in Chromium; inspect with FFprobe
        run: node tests/media-renderer-integration.mjs
      - name: Test real audiovisual MediaRecorder capture in Chromium and inspect with FFprobe
        run: node tests/media-capture-browser.mjs
      - name: Verify deployed Vercel preview in Chromium
        env:
          JAI_PREVIEW_URL: https://jai-viral-studio-git-jai-visual-assets-preview-f3dcf1-jai-cc19.vercel.app
        run: npm run test:preview
      - name: Upload mobile preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jai-preview-mobile-screenshot
          path: |
            artifacts/jai-preview-mobile.png
            artifacts/jai-chromium-av-capture.webm
            artifacts/jai-chromium-av-capture.ffprobe.json
            artifacts/jai-real-renderer-integration.webm
            artifacts/jai-real-renderer-integration.ffprobe.json
            artifacts/jai-production-export.webm
            artifacts/jai-production-export.mp4
            artifacts/jai-production-export.json
            artifacts/jai-production-export.ffprobe.json
          if-no-files-found: ignore
