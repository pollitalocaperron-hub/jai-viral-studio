name: Director quota and resume contracts
on:
  push:
    branches:
      - fix/director-quota-resume-20261123
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JAI_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chrome
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:api
      - name: Install Google Chrome Stable with native media codecs
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor --yes -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom 'data:text/html,<video id="v"></video><script>document.title=document.querySelector("video").canPlayType("video/mp4; codecs="+String.fromCharCode(34)+"avc1.42E01E, mp4a.40.2"+String.fromCharCode(34))||"NO_H264_AAC"</script>' | grep -q '<title>probably</title>\|<title>maybe</title>'
      - run: JAI_REQUIRE_FFPROBE=1 npm run test:e2e
      - name: Upload Chromium export and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jai-chromium-ffmpeg-diagnostics
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
