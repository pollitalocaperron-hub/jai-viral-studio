name: Director quota and resume contracts
on:
  push:
    branches:
      - fix/director-quota-resume-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api
