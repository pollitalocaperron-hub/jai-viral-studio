name: Director quota and resume contracts
on:
  push:
    branches:
      - fix/director-quota-resume-20261123
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:api
      - run: JAI_REQUIRE_FFPROBE=1 npm run test:e2e
      - name: Upload Chromium export and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jai-chromium-ffmpeg-diagnostics
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
